<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About | Zostime</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="/src/css/global.css">

    <link rel="stylesheet" href="/components/navbar/style.css">
    <link rel="stylesheet" href="/components/footer/style.css">

    <script defer src="/components/navbar/script.js"></script>
    <script defer src="/components/footer/script.js"></script>
</head>
<body>
    <header>
        <nav class="navbar"></nav>
    </header>

    <main>
        <div class="about-container">
            <h1>About</h1>
            <div id="content"></div>
        </div>
        <!--suppress JSFileReferences, ExceptionCaughtLocallyJS -->
        <script type="module">
            import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";
            import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.es.js";

            async function loadAndRenderMarkdown(url) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const mdText = await response.text();
                    let rawHtml = marked.parse(mdText);
                    document.getElementById('content').innerHTML = DOMPurify.sanitize(rawHtml);
                } catch (error) {
                    console.error('Could not load or render markdown:', error);
                    document.getElementById('content').innerText = `${error}`;
                }
            }

            loadAndRenderMarkdown('/data/about.md');
        </script>
    </main>

    <footer class="footer"></footer>
</body>
</html>
